<!DOCTYPE html>
<!-- VERSION 12345 -->
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AlphaBAG | Professional Crypto Intelligence</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Preload fonts to prevent render blocking -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Prevent FOUC (Theme flash on load) -->
  <script>
    (function() {
      const theme = localStorage.getItem('theme') || 'dark';
      if (theme === 'light') {
        document.documentElement.classList.add('light');
      } else {
        document.documentElement.classList.remove('light');
      }
    })();
  </script>

  <script>
    // Safe Service Worker cleanup — only unregisters same-origin workers
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => {
        regs.forEach(r => {
          if (r.scope.includes(window.location.origin)) r.unregister();
        });
      });
    }

    // Global polyfills for Web3/AI SDKs - Non-destructive augmentation
    window.global = window;
    window.process = window.process || {};
    window.process.env = window.process.env || {};
    window.process.env.NODE_ENV = window.process.env.NODE_ENV || 'production';
    window.process.browser = true;
    window.process.version = window.process.version || '';
    window.process.nextTick = window.process.nextTick || ((cb) => setTimeout(cb, 0));

    window.Buffer = window.Buffer || {
      isBuffer: () => false,
      from: (str, enc) => {
        if (enc === 'base64') return { toString: () => btoa(str) };
        return str;
      }
    };
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>

</html>
