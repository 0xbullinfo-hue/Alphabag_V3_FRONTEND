<!DOCTYPE html>
<html>
<head>
    <title>Inspect Screenshot Colors</title>
</head>
<body>
    <h1>Color Inspector</h1>
    <div>
        <h2>Image 1: img1.png</h2>
        <canvas id="canvas1"></canvas>
        <div id="result1"></div>
    </div>
    <div>
        <h2>Image 2: img2.png</h2>
        <canvas id="canvas2"></canvas>
        <div id="result2"></div>
    </div>
    
    <script>
        function sampleImage(imgSrc, canvasId, resultId) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.getElementById(canvasId);
                const ctx = canvas.getContext('2d');
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                
                const imgData = ctx.getImageData(0, 0, img.width, img.height);
                const data = imgData.data;
                
                const colorMap = {};
                for (let i = 0; i < data.length; i += 4) {
                    const r = data[i];
                    const g = data[i+1];
                    const b = data[i+2];
                    const a = data[i+3];
                    if (a < 255) continue;
                    
                    const hex = "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
                    colorMap[hex] = (colorMap[hex] || 0) + 1;
                }
                
                const sortedColors = Object.entries(colorMap).sort((a, b) => b[1] - a[1]);
                let output = "<h3>Top 10 Most Frequent Colors:</h3><ul>";
                for (let j = 0; j < 10 && j < sortedColors.length; j++) {
                    output += `<li>Color: <strong style="color: ${sortedColors[j][0]}">${sortedColors[j][0]}</strong> (Count: ${sortedColors[j][1]})</li>`;
                }
                output += "</ul>";
                
                const getPixelHex = (x, y) => {
                    const p = ctx.getImageData(x, y, 1, 1).data;
                    return "#" + ((1 << 24) + (p[0] << 16) + (p[1] << 8) + p[2]).toString(16).slice(1);
                };
                
                output += "<h3>Sampled Pixels:</h3>";
                output += `<p>Pixel at (50, 50) [typically header/sidebar]: <strong>${getPixelHex(50, 50)}</strong></p>`;
                output += `<p>Pixel at (10, height/2) [typically sidebar/background border]: <strong>${getPixelHex(10, Math.floor(img.height/2))}</strong></p>`;
                output += `<p>Pixel at (width/2, height/2) [typically main content or chart card]: <strong>${getPixelHex(Math.floor(img.width/2), Math.floor(img.height/2))}</strong></p>`;
                output += `<p>Pixel at (width - 100, 300) [typically right panel card]: <strong>${getPixelHex(img.width - 100, 300)}</strong></p>`;
                
                document.getElementById(resultId).innerHTML = output;
                console.log(`Results for ${imgSrc}:`, sortedColors.slice(0, 15));
            };
            img.src = imgSrc;
        }
        
        sampleImage('/img1.png', 'canvas1', 'result1');
        sampleImage('/img2.png', 'canvas2', 'result2');
    </script>
</body>
</html>
