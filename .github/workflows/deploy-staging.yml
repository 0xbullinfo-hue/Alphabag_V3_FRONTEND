name: Build and Deploy Frontend to Namecheap (Staging)

on:
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  build-and-deploy-staging:
    name: Build & Deploy Staging
    runs-on: ubuntu-latest
    env:
      FTP_SERVER_EFFECTIVE: ${{ secrets.FTP_STAGING_SERVER || secrets.FTP_SERVER }}
      FTP_USERNAME_EFFECTIVE: ${{ secrets.FTP_STAGING_USERNAME || secrets.FTP_USERNAME }}
      FTP_PASSWORD_EFFECTIVE: ${{ secrets.FTP_STAGING_PASSWORD || secrets.FTP_PASSWORD }}
      FTP_SERVER_DIR_EFFECTIVE: ${{ secrets.FTP_STAGING_SERVER_DIR || '/public_html/staging/' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Show Node and npm versions
        run: |
          node -v
          npm -v

      - name: Install Dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build Application (Staging)
        run: npm run build
        env:
          # Use staging-specific API endpoints/keys where available.
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL_STAGING }}
          VITE_MARKET_PROXY_BASE_URL: ${{ secrets.VITE_MARKET_PROXY_BASE_URL_STAGING }}

          VITE_WALLETCONNECT_PROJECT_ID: ${{ secrets.VITE_WALLETCONNECT_PROJECT_ID }}

          VITE_BAG_TOKEN_ADDRESS_MAINNET: ${{ secrets.VITE_BAG_TOKEN_ADDRESS_MAINNET }}
          VITE_BAG_TOKEN_ADDRESS_TESTNET: ${{ secrets.VITE_BAG_TOKEN_ADDRESS_TESTNET }}
          VITE_MIN_BAG_REQUIRED: ${{ secrets.VITE_MIN_BAG_REQUIRED }}
          VITE_ENABLE_TOKEN_GATING: ${{ secrets.VITE_ENABLE_TOKEN_GATING }}
          VITE_ENVIRONMENT: staging

          VITE_DATA_MODE: ${{ secrets.VITE_DATA_MODE }}
          VITE_LAUNCH_MODE: full
          VITE_DEMO_MODE: false
          VITE_ENABLE_BACKGROUND_SYNC: ${{ secrets.VITE_ENABLE_BACKGROUND_SYNC }}


      - name: Validate FTP Secrets
        run: |
          [ -n "${FTP_SERVER_EFFECTIVE}" ] || { echo "Missing FTP server secret. Set FTP_STAGING_SERVER or FTP_SERVER."; exit 1; }
          [ -n "${FTP_USERNAME_EFFECTIVE}" ] || { echo "Missing FTP username secret. Set FTP_STAGING_USERNAME or FTP_USERNAME."; exit 1; }
          [ -n "${FTP_PASSWORD_EFFECTIVE}" ] || { echo "Missing FTP password secret. Set FTP_STAGING_PASSWORD or FTP_PASSWORD."; exit 1; }
          [ -n "${FTP_SERVER_DIR_EFFECTIVE}" ] || { echo "Missing effective staging server-dir."; exit 1; }

      - name: Sync Files to Namecheap FTP (Staging)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_SERVER_EFFECTIVE }}
          username: ${{ env.FTP_USERNAME_EFFECTIVE }}
          password: ${{ env.FTP_PASSWORD_EFFECTIVE }}
          local-dir: ./dist/
          # Default to Namecheap web-root staging folder; override via
          # FTP_STAGING_SERVER_DIR if needed.
          server-dir: ${{ env.FTP_SERVER_DIR_EFFECTIVE }}
          protocol: ftp
          port: 21
