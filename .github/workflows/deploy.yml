name: Build and Deploy Frontend to Namecheap

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Show Node and npm versions
      run: |
        node -v
        npm -v

    - name: Install Dependencies
      run: npm install --no-audit --no-fund

    - name: Typecheck
      run: npm run typecheck

    - name: Test
      run: npm test

    - name: Build Application
      run: npm run build
      env:
        # Backend lives on its own host (Node/Express + Postgres — this
        # cannot run on Namecheap shared hosting). This MUST point at
        # wherever alphabag_v3_backend is actually deployed, or every
        # API call from the built app will 404 against myalphabag.com
        # itself, which only serves static files.
        VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        VITE_MARKET_PROXY_BASE_URL: ${{ secrets.VITE_MARKET_PROXY_BASE_URL }}
        VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}

        # Required for the wallet-connect flow to work at all.
        VITE_WALLETCONNECT_PROJECT_ID: ${{ secrets.VITE_WALLETCONNECT_PROJECT_ID }}

        # Token gating
        VITE_BAG_TOKEN_ADDRESS_MAINNET: ${{ secrets.VITE_BAG_TOKEN_ADDRESS_MAINNET }}
        VITE_BAG_TOKEN_ADDRESS_TESTNET: ${{ secrets.VITE_BAG_TOKEN_ADDRESS_TESTNET }}
        VITE_MIN_BAG_REQUIRED: ${{ secrets.VITE_MIN_BAG_REQUIRED }}
        VITE_ENABLE_TOKEN_GATING: ${{ secrets.VITE_ENABLE_TOKEN_GATING }}
        VITE_ENVIRONMENT: ${{ secrets.VITE_ENVIRONMENT }}

        # Data source / feature flags
        VITE_DATA_MODE: ${{ secrets.VITE_DATA_MODE }}
        # BUG FIX: do not hardcode to full; use secret so teaser mode can deploy.
        VITE_LAUNCH_MODE: ${{ secrets.VITE_LAUNCH_MODE }}
        VITE_DEMO_MODE: false
        VITE_ENABLE_BACKGROUND_SYNC: ${{ secrets.VITE_ENABLE_BACKGROUND_SYNC }}


      # FTP sends credentials and files in plaintext and is non-atomic.
      # Netlify gives atomic, immutable, CDN-backed deploys for free.
      - name: Deploy to Netlify (atomic, immutable)
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: ./dist
          production-deploy: true
          deploy-message: ${{ github.event.head_commit.message }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Post-deploy secret scan
        run: node scripts/check-no-secrets.mjs
