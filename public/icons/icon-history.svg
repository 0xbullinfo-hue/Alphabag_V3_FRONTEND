<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Clock Circle Background -->
  <circle cx="256" cy="256" r="180" fill="#F5A663" stroke="#374151" stroke-width="22"/>
  <!-- Clock Face Dial -->
  <circle cx="256" cy="256" r="130" fill="#FFD200" stroke="#374151" stroke-width="18"/>
  <!-- Hour Marks -->
  <circle cx="256" cy="155" r="8" fill="#374151"/>
  <circle cx="357" cy="256" r="8" fill="#374151"/>
  <circle cx="256" cy="357" r="8" fill="#374151"/>
  <circle cx="155" cy="256" r="8" fill="#374151"/>
  <!-- Clock Hands -->
  <line x1="256" y1="256" x2="256" y2="180" stroke="#374151" stroke-width="18" stroke-linecap="round"/>
  <line x1="256" y1="256" x2="316" y2="256" stroke="#374151" stroke-width="16" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="14" fill="#F5A663" stroke="#374151" stroke-width="8"/>
  <!-- Curved History Counter-Clockwise Arrow -->
  <path d="M420 180 A 195 195 0 0 0 100 180" fill="none" stroke="#374151" stroke-width="22" stroke-linecap="round"/>
  <polygon points="110,130 70,185 130,200" fill="#FFD200" stroke="#374151" stroke-width="14" stroke-linejoin="round"/>
</svg>
