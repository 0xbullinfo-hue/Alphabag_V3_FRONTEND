<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Outer Body -->
  <rect x="96" y="56" width="320" height="400" rx="42" fill="#F5A663" stroke="#374151" stroke-width="22" stroke-linejoin="round"/>
  <!-- Screen Recess -->
  <rect x="136" y="96" width="240" height="88" rx="20" fill="#FFD200" stroke="#374151" stroke-width="20" stroke-linejoin="round"/>
  <!-- Screen Highlight bar -->
  <line x1="160" y1="140" x2="352" y2="140" stroke="#374151" stroke-width="12" stroke-linecap="round" stroke-dasharray="16 12"/>
  <!-- Row 1 Buttons -->
  <circle cx="170" cy="235" r="28" fill="#FFD200" stroke="#374151" stroke-width="18"/>
  <circle cx="256" cy="235" r="28" fill="#FFD200" stroke="#374151" stroke-width="18"/>
  <circle cx="342" cy="235" r="28" fill="#FFD200" stroke="#374151" stroke-width="18"/>
  <!-- Row 2 Buttons -->
  <circle cx="170" cy="315" r="28" fill="#FFD200" stroke="#374151" stroke-width="18"/>
  <circle cx="256" cy="315" r="28" fill="#FFD200" stroke="#374151" stroke-width="18"/>
  <circle cx="342" cy="315" r="28" fill="#FFD200" stroke="#374151" stroke-width="18"/>
  <!-- Row 3 Buttons: Clear & Double-wide Equals -->
  <circle cx="170" cy="395" r="28" fill="#FFD200" stroke="#374151" stroke-width="18"/>
  <rect x="228" y="367" width="142" height="56" rx="28" fill="#FFD200" stroke="#374151" stroke-width="18" stroke-linejoin="round"/>
  <!-- Equals Sign on button -->
  <line x1="284" y1="390" x2="314" y2="390" stroke="#374151" stroke-width="8" stroke-linecap="round"/>
  <line x1="284" y1="400" x2="314" y2="400" stroke="#374151" stroke-width="8" stroke-linecap="round"/>
</svg>
