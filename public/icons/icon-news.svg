<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Back Paper Drop Shadow / Stack -->
  <rect x="76" y="100" width="320" height="340" rx="32" fill="#E58A46" stroke="#374151" stroke-width="22" stroke-linejoin="round"/>
  <!-- Front Newspaper Sheet -->
  <rect x="116" y="60" width="320" height="350" rx="32" fill="#F5A663" stroke="#374151" stroke-width="22" stroke-linejoin="round"/>
  <!-- Newspaper Header / Masthead -->
  <rect x="150" y="96" width="252" height="40" rx="12" fill="#FFD200" stroke="#374151" stroke-width="14" stroke-linejoin="round"/>
  <!-- Article Photo Box -->
  <rect x="150" y="160" width="110" height="100" rx="16" fill="#FFD200" stroke="#374151" stroke-width="16" stroke-linejoin="round"/>
  <!-- Article Headlines & Lines (Right) -->
  <line x1="280" y1="175" x2="390" y2="175" stroke="#374151" stroke-width="14" stroke-linecap="round"/>
  <line x1="280" y1="205" x2="380" y2="205" stroke="#374151" stroke-width="12" stroke-linecap="round"/>
  <line x1="280" y1="235" x2="360" y2="235" stroke="#374151" stroke-width="12" stroke-linecap="round"/>
  <!-- Bottom Article Columns -->
  <line x1="150" y1="290" x2="390" y2="290" stroke="#374151" stroke-width="14" stroke-linecap="round"/>
  <line x1="150" y1="325" x2="390" y2="325" stroke="#374151" stroke-width="12" stroke-linecap="round"/>
  <line x1="150" y1="360" x2="330" y2="360" stroke="#374151" stroke-width="12" stroke-linecap="round"/>
</svg>
