<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Outer Platform / Frame Base -->
  <line x1="60" y1="440" x2="452" y2="440" stroke="#374151" stroke-width="24" stroke-linecap="round"/>
  <!-- Bar 1 (Left, Short) -->
  <line x1="130" y1="260" x2="130" y2="430" stroke="#374151" stroke-width="12" stroke-linecap="round"/>
  <rect x="100" y="290" width="60" height="110" rx="16" fill="#F5A663" stroke="#374151" stroke-width="18" stroke-linejoin="round"/>
  <!-- Bar 2 (Middle, Medium) -->
  <line x1="256" y1="170" x2="256" y2="430" stroke="#374151" stroke-width="12" stroke-linecap="round"/>
  <rect x="226" y="210" width="60" height="170" rx="16" fill="#FFD200" stroke="#374151" stroke-width="18" stroke-linejoin="round"/>
  <!-- Bar 3 (Right, Tall) -->
  <line x1="382" y1="100" x2="382" y2="430" stroke="#374151" stroke-width="12" stroke-linecap="round"/>
  <rect x="352" y="140" width="60" height="230" rx="16" fill="#FFD200" stroke="#374151" stroke-width="18" stroke-linejoin="round"/>
  <!-- Bullish Trend Arrow -->
  <path d="M80 340 Q 200 240, 360 80" fill="none" stroke="#374151" stroke-width="26" stroke-linecap="round"/>
  <path d="M80 340 Q 200 240, 360 80" fill="none" stroke="#FFD200" stroke-width="14" stroke-linecap="round"/>
  <!-- Arrowhead -->
  <polygon points="360,50 395,95 330,105" fill="#FFD200" stroke="#374151" stroke-width="18" stroke-linejoin="round"/>
</svg>
